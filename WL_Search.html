<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchList_Search [준법추진파트]</title>
    <!-- 유사도 계산을 위한 Fuzzball 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/fuzzball@2.1.2/dist/fuzzball.umd.min.js"></script>
    <!-- CSV 파싱을 위한 PapaParse 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    
    <style>
        :root {
            --bg-color: #2c3e50;
            --card-color: #34495e;
            --text-color: #ecf0f1;
            --btn-color: #3498db;
            --result-bg: #1e272e;
            --match-color: #2ecc71;
            --error-color: #e74c3c;
            --warning-color: #f39c12;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Malgun Gothic', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            font-size: 24px;
            font-weight: bold;
            color: var(--btn-color);
            margin-bottom: 10px;
        }

        .card {
            background-color: var(--card-color);
            padding: 20px;
            border-radius: 6px;
            display: grid;
            grid-template-columns: 120px 1fr 140px;
            gap: 12px;
            align-items: center;
        }

        label {
            font-weight: bold;
            font-size: 14px;
        }

        input[type="text"], select, input[type="file"] {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            background-color: #ffffff;
            color: #333;
        }

        .file-upload-section {
            grid-column: span 3;
            border: 2px dashed #7f8c8d;
            padding: 15px;
            border-radius: 4px;
            background-color: rgba(0, 0, 0, 0.1);
            font-size: 13px;
        }

        .file-status {
            margin-top: 8px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge {
            background-color: #7f8c8d;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: white;
            transition: all 0.3s;
        }
        .badge.loading {
            background-color: var(--warning-color);
        }
        .badge.loaded { 
            background-color: var(--match-color); 
            font-weight: bold;
        }
        .badge.error {
            background-color: var(--error-color);
            font-weight: bold;
        }

        .btn-reload {
            margin-top: 10px;
            padding: 5px 12px;
            background-color: var(--btn-color);
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-search {
            grid-column: 3;
            grid-row: 2 / span 2;
            background-color: var(--btn-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            height: 100%;
            min-height: 80px;
            transition: background-color 0.2s;
        }

        .btn-search:hover {
            background-color: #2980b9;
        }

        .result-area {
            background-color: var(--result-bg);
            color: #d2dae2;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            padding: 15px;
            border-radius: 6px;
            height: 480px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .text-header { color: var(--btn-color); font-weight: bold; font-size: 15px; }
        .text-match { color: var(--match-color); font-weight: bold; }
        .text-error { color: var(--error-color); }
        .text-warning { color: var(--warning-color); }
    </style>
</head>
<body>

<div class="container">
    <header>WatchList 검색 [준법추진파트]</header>

    <div class="card">
        <!-- CSV 파일 등록 및 서버 로드 영역 -->
        <div class="file-upload-section">
            <label>📂 WatchList CSV 파일 상태 (서버 자동 탐색 / 수동 로드)</label>
            <div class="file-status" id="fileStatus">
                <span class="badge" id="badge-cia">CIA_PEPS.csv</span>
                <span class="badge" id="badge-ofac">OFAC_SDN.csv</span>
                <span class="badge" id="badge-un">UN_Sanctions_List.csv</span>
                <span class="badge" id="badge-fsc">금융거래대상자.csv</span>
            </div>
            <button class="btn-reload" onclick="checkAndLoadServerFiles()">🔄 서버 파일 다시 불러오기</button>
            
            <div style="margin-top: 15px; border-top: 1px dotted #7f8c8d; padding-top: 10px;">
                <label for="fileInput" style="font-weight: normal; font-size: 12px;">수동 로드 필요시 선택:</label>
                <input type="file" id="fileInput" multiple accept=".csv" style="margin-top: 5px; width: 100%;">
            </div>
        </div>

        <!-- 검색 조건 설정 -->
        <label for="entryName">성명</label>
        <input type="text" id="entryName" placeholder="검색할 성명 입력" onkeydown="if(event.key==='Enter') performSearch()">

        <button class="btn-search" onclick="performSearch()">조회 (SEARCH)</button>

        <label for="comboThreshold">유사도(%)</label>
        <select id="comboThreshold">
            <option value="40">40</option>
            <option value="50" selected>50</option>
            <option value="60">60</option>
            <option value="70">70</option>
            <option value="80">80</option>
            <option value="90">90</option>
            <option value="100">100</option>
        </select>
    </div>

    <!-- 결과 출력 영역 -->
    <div class="result-area" id="textArea"></div>
</div>

<script>
    // 기본 서버 base 경로 설정
    const BASE_SERVER_URL = "https://checki-new.github.io/wl/data/";
    
    // GitHub Raw URL Fallback (Github Pages 교차 접근 또는 캐시 관련 대비용 주소)
    const FALLBACK_RAW_URL = "https://raw.githubusercontent.com/checki-new/wl/main/data/";

    // CSV 데이터 구조체 설정
    const csvSources = {
        'CIA_PEPS.csv': { name: 'CIA_peps', nameIdx: 2, data: null, loadedKey: 'cia' },
        'OFAC_SDN.csv': { name: 'OFAC_SDN', nameIdx: 1, data: null, loadedKey: 'ofac' },
        'UN_Sanctions_List.csv': { name: 'UN_List', nameIdx: 1, data: null, loadedKey: 'un' },
        '금융거래대상자.csv': { name: '금융위원회', nameIdx: 0, data: null, loadedKey: 'fsc' }
    };

    // 웹페이지 로드 시 서버에서 자동으로 CSV 존재 확인 및 다운로드 실행
    window.addEventListener('DOMContentLoaded', () => {
        checkAndLoadServerFiles();
    });

    // 서버 파일 존재 확인 및 로드 로직
    async function checkAndLoadServerFiles() {
        const textArea = document.getElementById('textArea');
        textArea.innerHTML = '';
        appendText("🔄 서버 경로 [ " + BASE_SERVER_URL + " ] 파일 탐색 중...\n\n", 'text-header');

        for (const fileName of Object.keys(csvSources)) {
            const source = csvSources[fileName];
            updateBadgeStatus(source.loadedKey, 'loading', `⏳ ${fileName} (확인중)`);

            let targetUrl = BASE_SERVER_URL + encodeURIComponent(fileName);
            
            try {
                // 1차 시도: GitHub Pages 경로 확인
                let response = await fetch(targetUrl, { method: 'GET' });
                
                // 1차 시도 실패 시 Raw 주소로 2차 시도
                if (!response.ok) {
                    console.warn(`[1차 접근 실패] ${targetUrl} (Status: ${response.status}). Fallback 주소로 재시도합니다.`);
                    targetUrl = FALLBACK_RAW_URL + encodeURIComponent(fileName);
                    response = await fetch(targetUrl, { method: 'GET' });
                }

                // 파일이 존재하는 경우 (HTTP Status 200 OK)
                if (response.ok) {
                    const csvText = await response.text();
                    
                    // PapaParse 이용한 데이터 파싱
                    Papa.parse(csvText, {
                        skipEmptyLines: true,
                        complete: function(results) {
                            if (results.data && results.data.length > 0) {
                                source.data = results.data.slice(1); // Header 제거
                                updateBadgeStatus(source.loadedKey, 'loaded', `✓ ${fileName} (존재함)`);
                                appendText(`✅ [성공] ${fileName} 파일 발견 및 로드 완료 (총 ${source.data.length}건)\n`);
                            } else {
                                updateBadgeStatus(source.loadedKey, 'error', `✕ ${fileName} (빈 파일)`);
                                appendText(`⚠️ [경고] ${fileName} 파일은 존재하지만 데이터가 없습니다.\n`, 'text-warning');
                            }
                        },
                        error: function(err) {
                            updateBadgeStatus(source.loadedKey, 'error', `✕ ${fileName} (파싱 실패)`);
                            appendText(`❌ [오류] ${fileName} 파싱 에러: ${err.message}\n`, 'text-error');
                        }
                    });
                } else {
                    // 파일이 서버에 존재하지 않음 (404 Not Found 등)
                    updateBadgeStatus(source.loadedKey, 'error', `✕ ${fileName} (미존재 - ${response.status})`);
                    appendText(`❌ [미존재] ${fileName} (HTTP Status: ${response.status})\n`, 'text-error');
                    source.data = null;
                }
            } catch (error) {
                // 네트워크 오류 등으로 접근할 수 없는 경우
                updateBadgeStatus(source.loadedKey, 'error', `✕ ${fileName} (접근 불가)`);
                appendText(`❌ [접근 불가] ${fileName} 네트워크/CORS 에러 발생\n`, 'text-error');
                source.data = null;
            }
        }
    }

    // 수동 CSV 파일 업로드 이벤트 핸들러 (유지)
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const files = e.target.files;
        if (!files || files.length === 0) return;
        
        Array.from(files).forEach(file => {
            const fileName = file.name;
            
            let matchedKey = Object.keys(csvSources).find(key => 
                key.toLowerCase() === fileName.toLowerCase() ||
                fileName.toLowerCase().includes(csvSources[key].loadedKey) ||
                (key.includes('금융') && fileName.includes('금융'))
            );
            
            if (matchedKey) {
                Papa.parse(file, {
                    encoding: "utf-8",
                    skipEmptyLines: true,
                    complete: function(results) {
                        if (results.data && results.data.length > 0) {
                            csvSources[matchedKey].data = results.data.slice(1);
                            updateBadgeStatus(csvSources[matchedKey].loadedKey, 'loaded', `✓ ${matchedKey} (수동 로드됨)`);
                            appendText(`\n📁 [수동 등록] ${matchedKey} 파일이 수동으로 교체되었습니다.\n`, 'text-match');
                        }
                    },
                    error: function(err) {
                        alert(`파일 읽기 실패: ${file.name}`);
                    }
                });
            }
        });
    });

    // 배지 상태 업데이트 함수
    function updateBadgeStatus(loadedKey, state, text) {
        const badgeId = `badge-${loadedKey}`;
        const el = document.getElementById(badgeId);
        if (!el) return;

        el.classList.remove('loaded', 'error', 'loading');
        if (state) el.classList.add(state);
        el.innerText = text;
    }

    // 결과 창에 메시지/태그 추가 함수
    function appendText(text, className = '') {
        const textArea = document.getElementById('textArea');
        if (className) {
            const span = document.createElement('span');
            span.className = className;
            span.textContent = text;
            textArea.appendChild(span);
        } else {
            textArea.appendChild(document.createTextNode(text));
        }
    }

    // 개별 CSV 대상 유사도 검색 함수
    function searchInCsv(sourceKey, searchName, threshold) {
        const source = csvSources[sourceKey];
        
        appendText(`🔍 ${source.name} [${sourceKey}] : '${searchName}' 검색 결과 (유사도 ${threshold}% 이상)\n`, 'text-header');
        appendText("—".repeat(60) + "\n");

        if (!source.data) {
            appendText(`⚠️ 파일이 서버에서 읽히지 않았거나 로드되지 않았습니다.\n\n`, 'text-error');
            return;
        }

        let foundCount = 0;

        source.data.forEach(row => {
            if (!row || row.length <= source.nameIdx) return;

            const targetName = String(row[source.nameIdx]).trim();
            if (!targetName) return;
            
            // Fuzzball (Token Set Ratio) 알고리즘으로 유사도(%) 계산
            const similarity = fuzzball.token_set_ratio(searchName, targetName);

            if (similarity >= threshold) {
                foundCount++;
                appendText(`✅ [유사도 ${similarity}%] ${targetName}\n`, 'text-match');
                
                const displayData = row.slice(0, 8).map(cell => String(cell).trim()).join(' | ');
                appendText(`   상세: ${displayData}\n\n`);
            }
        });

        if (foundCount === 0) {
            appendText("❌ 일치하는 정보가 없습니다.\n\n", 'text-error');
        }
    }

    // 메인 검색 버튼 실행 함수
    function performSearch() {
        const searchName = document.getElementById('entryName').value.trim();
        const threshold = parseInt(document.getElementById('comboThreshold').value, 10) || 50;

        if (!searchName) {
            alert("검색할 성명을 입력하세요.");
            document.getElementById('entryName').focus();
            return;
        }

        const textArea = document.getElementById('textArea');
        textArea.innerHTML = '';

        Object.keys(csvSources).forEach(key => {
            searchInCsv(key, searchName, threshold);
        });

        textArea.scrollTop = 0;
    }
</script>

</body>
</html>
